<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistência Técnica · Colibri Móveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
window.CHART_READY = new Promise((resolve)=>{
  (function loadChart(urls){
    const url = urls.shift();
    if(!url){ console.error("Não foi possível carregar o Chart.js de nenhum CDN."); resolve(false); return; }
    const s = document.createElement("script");
    s.src = url;
    s.onload = () => resolve(true);
    s.onerror = () => loadChart(urls);
    document.head.appendChild(s);
  })([
    "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js",
    "https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"
  ]);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#F3F5F1;
    --bg-soft:#EAEFE9;
    --surface:#FFFFFF;
    --ink:#20302A;
    --ink-soft:#5C6E65;
    --ink-faint:#8B9B92;
    --teal:#1F6F63;
    --teal-dark:#123E37;
    --teal-pale:#DCEBE6;
    --terracotta:#C15A2E;
    --terracotta-pale:#F3DFCF;
    --sage:#7C9E70;
    --sage-pale:#E4EDDE;
    --amber:#D9A441;
    --amber-pale:#F6E8CB;
    --rose:#BD5F63;
    --rose-pale:#F2DEDD;
    --border:#DDE4DD;
    --shadow: 0 1px 2px rgba(18,62,55,0.06), 0 8px 24px -12px rgba(18,62,55,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num, .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  h1,h2,h3,.display{ font-family:'Fraunces', ui-serif, Georgia, serif; }

  /* ---------- Layout ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width:248px; flex-shrink:0;
    background: linear-gradient(180deg, var(--teal-dark) 0%, #0F332D 100%);
    color:#EAF3F0;
    display:flex; flex-direction:column;
    padding:28px 20px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ margin-bottom:6px; }
  .logo-badge{
    background:#fff; border-radius:14px; padding:16px 18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px -6px rgba(0,0,0,0.35);
  }
  .logo-badge img{ width:100%; height:auto; display:block; }
  .brand-text{ line-height:1.15; margin-top:12px; }
  .brand-text .name{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:#fff; }
  .brand-text .sub{ font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:#9FC3B8; margin-top:2px; }

  .sidebar-tagline{
    font-size:12px; color:#A9CAC0; line-height:1.5; margin:18px 0 26px;
    padding-bottom:22px; border-bottom:1px solid rgba(255,255,255,0.12);
  }

  nav.tabs{ display:flex; flex-direction:column; gap:4px; flex:1; }
  nav.tabs button{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px;
    font-size:13.5px; font-weight:500; color:#CFE4DD;
    transition: background .15s ease, color .15s ease;
  }
  nav.tabs button svg{ width:17px; height:17px; opacity:.85; flex-shrink:0; }
  nav.tabs button:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  nav.tabs button.active{ background:#EAF3F0; color:var(--teal-dark); font-weight:700; }
  nav.tabs button.active svg{ opacity:1; }

  .sidebar-foot{ font-size:11px; color:#7FA79A; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12); }
  .sidebar-foot b{ color:#CFE4DD; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    padding:26px 40px 18px; display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap; border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  .topbar h1{ font-size:26px; margin:0 0 4px; font-weight:600; color:var(--ink); }
  .topbar p{ margin:0; color:var(--ink-soft); font-size:13.5px; max-width:520px; }

  .month-control{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 14px; box-shadow:var(--shadow); }
  .month-control label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:600; }
  .month-control input[type=month]{
    border:none; outline:none; font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--teal-dark); font-weight:600; background:transparent;
  }

  .view{ padding:28px 40px 60px; }
  .view.hidden{ display:none; }

  /* ---------- KPI cards ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:28px; }
  @media (max-width:1200px){ .kpi-grid{ grid-template-columns:repeat(2,1fr);} }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--teal)); }
  .kpi .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; margin-bottom:10px; }
  .kpi .value{ font-size:30px; font-weight:700; font-family:'Fraunces',serif; color:var(--ink); line-height:1; }
  .kpi .value small{ font-size:15px; font-weight:500; color:var(--ink-faint); }
  .kpi .delta{ margin-top:10px; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .kpi .delta.up{ color:var(--sage); } .kpi .delta.down{ color:var(--rose); } .kpi .delta.flat{ color:var(--ink-faint); }
  .kpi .meta-note{ margin-top:4px; font-size:11px; color:var(--ink-faint); }

  /* ---------- Panels / charts ---------- */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px 24px; box-shadow:var(--shadow); margin-bottom:22px; }
  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
  .panel-head h3{ margin:0; font-size:16.5px; font-weight:600; color:var(--ink); }
  .panel-head .hint{ font-size:12px; color:var(--ink-faint); }
  .chart-wrap{ position:relative; height:270px; }
  .chart-wrap.short{ height:220px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:900px){ .two-col{ grid-template-columns:1fr; } }
  .three-col{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width:900px){ .three-col{ grid-template-columns:1fr; } }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; color:var(--ink-faint); text-align:center; gap:10px;}
  .empty-state svg{ width:46px; height:46px; opacity:.5; }
  .empty-state b{ color:var(--ink-soft); }

  /* ---------- Forms ---------- */
  .form-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:900px){ .form-grid{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px;
    font-family:inherit; color:var(--ink); background:#FBFCFB; outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--teal); background:#fff; }
  .field textarea{ resize:vertical; min-height:64px; }

  .motivo-row{ display:grid; grid-template-columns:1fr 100px 36px; gap:8px; margin-bottom:8px; align-items:center; }
  .motivo-list-head{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; margin-bottom:8px; }

  button.btn{
    all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding:10px 16px; border-radius:10px; font-size:13.5px; font-weight:600; transition:all .15s ease;
  }
  button.btn svg{ width:15px; height:15px; }
  button.btn.primary{ background:var(--teal); color:#fff; }
  button.btn.primary:hover{ background:var(--teal-dark); }
  button.btn.ghost{ background:var(--bg-soft); color:var(--ink); border:1px solid var(--border); }
  button.btn.ghost:hover{ background:#E1E9E0; }
  button.btn.danger{ background:var(--rose-pale); color:var(--rose); }
  button.btn.danger:hover{ background:#EAC7C6; }
  button.btn.sm{ padding:6px 10px; font-size:12px; }
  button.icon-btn{ all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; color:var(--ink-faint); }
  button.icon-btn:hover{ background:var(--bg-soft); color:var(--rose); }
  button.icon-btn svg{ width:15px; height:15px; }

  .save-bar{ display:flex; align-items:center; gap:12px; margin-top:18px; }
  .save-msg{ font-size:12.5px; color:var(--sage); font-weight:600; opacity:0; transition:opacity .3s; }
  .save-msg.show{ opacity:1; }

  fieldset{ border:none; padding:0; margin:0 0 24px; }
  legend{ font-size:14px; font-weight:700; color:var(--teal-dark); margin-bottom:12px; padding:0; font-family:'Fraunces',serif; }

  /* ---------- Kanban ---------- */
  .kanban-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .kanban{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start; }
  @media (max-width:1000px){ .kanban{ grid-template-columns:1fr; } }
  .kcol{ background:var(--bg-soft); border-radius:16px; padding:14px; min-height:120px; border:1px dashed var(--border); }
  .kcol.dragover{ border-color:var(--teal); background:var(--teal-pale); }
  .kcol-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 4px; }
  .kcol-head .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:8px; }
  .kcol-head h4{ margin:0; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:flex; align-items:center; }
  .kcol-head .count{ background:#fff; border:1px solid var(--border); border-radius:20px; font-size:11px; font-weight:700; padding:2px 9px; color:var(--ink-soft); }
  .kcard{
    background:#fff; border-radius:12px; padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);
    border-left:4px solid var(--accent,var(--teal)); cursor:grab; transition:transform .1s;
  }
  .kcard:active{ cursor:grabbing; }
  .kcard.dragging{ opacity:.4; }
  .kcard .ktitle{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:4px; line-height:1.3; }
  .kcard .kdesc{ font-size:12.5px; color:var(--ink-soft); line-height:1.4; margin-bottom:10px; }
  .kcard .kmeta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .badge{ font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; background:var(--bg-soft); color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; }
  .badge.overdue{ background:var(--rose-pale); color:var(--rose); }
  .kcard .kactions{ display:flex; justify-content:space-between; align-items:center; }
  .kcard select.move{ font-size:11px; border:1px solid var(--border); border-radius:7px; padding:4px 6px; color:var(--ink-soft); background:#FBFCFB; }
  .kcard .kbtns{ display:flex; gap:4px; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(18,44,39,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-overlay.hidden{ display:none; }
  .modal{ background:#fff; border-radius:18px; padding:26px; width:100%; max-width:460px; box-shadow:0 30px 60px -20px rgba(0,0,0,.35); }
  .modal h3{ margin:0 0 16px; font-size:18px; }
  .modal .field{ margin-bottom:14px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  /* ---------- Misc ---------- */
  .tag-select{ display:flex; gap:8px; flex-wrap:wrap; }
  .status-pill{ padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--ink-soft); }
  .status-pill.selected{ background:var(--teal); color:#fff; border-color:var(--teal); }

  /* ---------- Diário (timeline) ---------- */
  .timeline{ position:relative; padding-left:2px; }
  .tl-item{ display:flex; gap:16px; position:relative; padding-bottom:20px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{ content:""; position:absolute; left:5px; top:17px; bottom:-6px; width:2px; background:var(--border); }
  .tl-item:last-child::before{ display:none; }
  .tl-marker{ width:12px; height:12px; border-radius:50%; background:var(--accent,var(--teal)); margin-top:5px; flex-shrink:0; box-shadow:0 0 0 4px #fff, 0 0 0 5px var(--border); }
  .tl-content{ flex:1; background:var(--bg-soft); border-radius:12px; padding:14px 16px; }
  .tl-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .tl-date{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; color:var(--ink); background:#fff; border:1px solid var(--border); border-radius:7px; padding:2px 8px; }
  .tl-desc{ font-size:13.5px; color:var(--ink); line-height:1.55; white-space:pre-wrap; }
  .tl-acao{ margin-top:9px; font-size:12.5px; color:var(--ink-soft); background:#fff; border-radius:9px; padding:9px 11px; line-height:1.5; }
  .tl-acao b{ color:var(--ink); }
  .tl-actions{ display:flex; justify-content:flex-end; gap:4px; margin-top:8px; }
  .day-group-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--ink-faint); margin:18px 0 8px; }
  .day-group-label:first-child{ margin-top:0; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#C9D6CE; border-radius:10px; }
</style>
</head>

<div id="app"></div>
<div id="modal-root"></div>

const FAIXAS = [
  { key:"vermelha", label:"Faixa Vermelha", min:0,    max:1.50, color:"#D64545", pale:"#F6D9D8" },
  { key:"laranja",  label:"Faixa Laranja",  min:1.50, max:2.50, color:"#E08A3C", pale:"#F8E4CE" },
  { key:"amarela",  label:"Faixa Amarela",  min:2.50, max:3.50, color:"#D6B93C", pale:"#F7F0CE" },
  { key:"verde",    label:"Faixa Verde",    min:3.50, max:4.50, color:"#6FA35A", pale:"#E2EEDD" },
  { key:"azul",     label:"Faixa Azul",     min:4.50, max:5.01, color:"#3E7CB1", pale:"#DBE8F2" }
];
function faixaFor(value, inverted=false){
  const v = Number(value) || 0;
  let idx = FAIXAS.findIndex(f => v >= f.min && v < f.max);
  if(idx === -1) idx = v < 0 ? 0 : FAIXAS.length - 1;
  if(inverted) idx = FAIXAS.length - 1 - idx;
  return FAIXAS[idx];
}
function faixaBadge(value, inverted=false){
  const f = faixaFor(value, inverted);
  return `<span class="badge" style="background:${f.pale};color:${f.color};font-weight:700;">${f.label}</span>`;
}
function faixaLegendHtml(){
  return `<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;">
    ${FAIXAS.map(f=>`<span class="badge" style="background:${f.pale};color:${f.color};font-weight:700;">${f.label.replace("Faixa ","")} · ${f.min===0?"0,01":f.min.toFixed(2).replace(".",",")}–${(f.max>5?5:f.max).toFixed(2).replace(".",",")}</span>`).join("")}
  </div>`;
}

function fmtMonthLabel(key){ const [y,m] = key.split("-"); return MONTH_NAMES[parseInt(m,10)-1] + "/" + y.slice(2); }

/* ============================================================
   STORAGE (Supabase)
   Requer config.js definindo SUPABASE_URL e SUPABASE_ANON_KEY,
   e a tabela "colibri_at_storage" (key text PK, value jsonb).
   Ver README.md / schema.sql para criar a tabela no Supabase.
============================================================ */
const sb = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;

async function storageGet(key){
  if(!sb) return null;
  const { data, error } = await sb.from("colibri_at_storage").select("value").eq("key", key).maybeSingle();
  if(error){ console.error(`Falha ao ler "${key}"`, error); return null; }
  return data ? data.value : null;
}
async function storageSet(key, value){
  if(!sb) return;
  const { error } = await sb.from("colibri_at_storage").upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: "key" });
  if(error) console.error(`Falha ao salvar "${key}"`, error);
}

async function loadAll(){
  if(!sb){
    alert("Conexão com o Supabase não configurada. Edite o arquivo config.js com sua SUPABASE_URL e SUPABASE_ANON_KEY.");
    state.loaded = true;
    return;
  }
  try{
    const v = await storageGet("colibri-at-monthly-data");
    state.monthlyData = v || {};
  }catch(e){ state.monthlyData = {}; }
  try{
    const v = await storageGet("colibri-at-metas");
    state.metas = v ? { ...state.metas, ...v } : state.metas;
  }catch(e){ /* keep defaults */ }
  try{
    const v = await storageGet("colibri-at-actions");
    state.actions = v || [];
  }catch(e){ state.actions = []; }
  try{
    const v = await storageGet("colibri-at-diario");
    state.diario = v || [];
  }catch(e){ state.diario = []; }
  try{
    const v = await storageGet("colibri-at-treinamentos");
    state.treinamentos = v || [];
  }catch(e){ state.treinamentos = []; }

  const keys = Object.keys(state.monthlyData).sort();
  if(keys.length) state.selectedMonth = keys[keys.length-1];
  state.loaded = true;
}
async function saveMonthlyData(){
  try{ await storageSet("colibri-at-monthly-data", state.monthlyData); }
  catch(e){ console.error("Falha ao salvar dados mensais", e); }
}
async function saveMetas(){
  try{ await storageSet("colibri-at-metas", state.metas); }
  catch(e){ console.error("Falha ao salvar metas", e); }
}
async function saveActions(){
  try{ await storageSet("colibri-at-actions", state.actions); }
  catch(e){ console.error("Falha ao salvar plano de ação", e); }
}
async function saveDiario(){
  try{ await storageSet("colibri-at-diario", state.diario); }
  catch(e){ console.error("Falha ao salvar diário de qualidade", e); }
}
async function saveTreinamentos(){
  try{ await storageSet("colibri-at-treinamentos", state.treinamentos); }
  catch(e){ console.error("Falha ao salvar treinamentos", e); }
}

  document.getElementById("btn-export").addEventListener("click", exportBackup);
  document.getElementById("import-file").addEventListener("change", importBackup);
}
function exportBackup(){
  const payload = {
    tipo: "colibri-assistencia-tecnica-backup",
    versao: 1,
    exportadoEm: new Date().toISOString(),
    monthlyData: state.monthlyData,
    metas: state.metas,
    actions: state.actions,
    diario: state.diario,
    treinamentos: state.treinamentos
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `colibri-assistencia-tecnica-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.monthlyData && !data.actions && !data.diario){
        alert("Esse arquivo não parece ser um backup válido deste painel.");
        return;
      }
      if(!confirm("Importar vai substituir os dados atuais deste painel pelos dados do arquivo. Continuar?")) return;
      state.monthlyData = data.monthlyData || {};
      state.metas = data.metas || state.metas;
      state.actions = data.actions || [];
      state.diario = data.diario || [];
      state.treinamentos = data.treinamentos || [];
      await Promise.all([saveMonthlyData(), saveMetas(), saveActions(), saveDiario(), saveTreinamentos()]);
      const keys = Object.keys(state.monthlyData).sort();
      if(keys.length) state.selectedMonth = keys[keys.length-1];
      closeModal();
      render();
      alert("Backup importado com sucesso.");
    }catch(err){
      alert("Não foi possível ler esse arquivo. Verifique se é o .json exportado por este painel.");
    }
  };
  reader.readAsText(file);
}

function sortedMonths(){ return Object.keys(state.monthlyData).sort(); }
function prevMonthKey(key){
  const [y,m] = key.split("-").map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function deltaBlock(curr, prev, higherIsBetter, unit=""){
  if(prev===undefined || prev===null || isNaN(prev)) return `<div class="delta flat">${ICONS.flat}Sem mês anterior</div>`;
  const diff = curr - prev;
  if(Math.abs(diff) < 0.0001) return `<div class="delta flat">${ICONS.flat}Estável vs. mês anterior</div>`;
  const good = higherIsBetter ? diff>0 : diff<0;
  const icon = diff>0 ? ICONS.up : ICONS.down;
  const cls = good ? "up" : "down";
  const sign = diff>0 ? "+" : "";
  return `<div class="delta ${cls}">${icon}${sign}${diff.toFixed(1)}${unit} vs. mês anterior</div>`;
}

      ${kpiCard("Taxa assistência — Peças", taxaPecas.toFixed(2), "%", "var(--amber)", deltaBlock(taxaPecas, pTaxaPecas, false, "pp"))}

function destroyChart(id){ if(state.charts[id]){ state.charts[id].destroy(); delete state.charts[id]; } }

function wireOverviewCharts(){
  const months = sortedMonths();
  if(months.length===0) return;
  const labels = months.map(fmtMonthLabel);
  const scores = months.map(k=>state.monthlyData[k].score);
  const avals = months.map(k=>state.monthlyData[k].avaliacao);
  const ocorr = months.map(k=>state.monthlyData[k].ocorrencias);

  const scoreCanvas = document.getElementById("chart-score");
  if(scoreCanvas){
    destroyChart("score");
    state.charts.score = new Chart(scoreCanvas, {
      type:"line",
      data:{ labels, datasets:[
        { label:"Score", data:scores, borderColor:"#1F6F63", backgroundColor:"rgba(31,111,99,.10)", tension:.35, fill:true, pointRadius:5,
          pointBackgroundColor:scores.map(v=>faixaFor(v).color), pointBorderColor:"#fff", pointBorderWidth:1.5 },
        { label:"Meta Score", data:months.map(()=>state.metas.score), borderColor:"#1F6F63", borderDash:[6,5], pointRadius:0, borderWidth:1.5 },
        { label:"Avaliação", data:avals, borderColor:"#7C9E70", backgroundColor:"rgba(124,158,112,.10)", tension:.35, fill:true, pointRadius:5,
          pointBackgroundColor:avals.map(v=>faixaFor(v).color), pointBorderColor:"#fff", pointBorderWidth:1.5 },
      ]},
      options:chartOpts({ yMax:5 })
    });
  }
  const ocCanvas = document.getElementById("chart-ocorrencias");
  if(ocCanvas){
    destroyChart("ocorrencias");
    state.charts.ocorrencias = new Chart(ocCanvas, {
      type:"bar",
      data:{ labels, datasets:[
        { label:"Ocorrências (%)", data:ocorr, backgroundColor:ocorr.map(v=>faixaFor(v, true).color), borderRadius:6, maxBarThickness:34 },
        { label:"Meta (máx.)", data:months.map(()=>state.metas.ocorrencias), type:"line", borderColor:"#C15A2E", borderDash:[6,5], pointRadius:0, borderWidth:1.5 }
      ]},
      options:chartOpts({})
    });
  }
}
function chartOpts({yMax}={}){
  const base = {
    responsive:true, maintainAspectRatio:false,
    interaction:{ mode:"index", intersect:false },
    plugins:{ legend:{ position:"bottom", labels:{ usePointStyle:true, boxWidth:8, font:{family:"Inter", size:11.5}, color:"#5C6E65" } },
      tooltip:{ backgroundColor:"#123E37", titleFont:{family:"Inter",weight:600}, bodyFont:{family:"Inter"}, padding:10, cornerRadius:8 } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ color:"#8B9B92", font:{family:"Inter", size:11.5} } },
      y:{ grid:{ color:"#EAEFE9" }, ticks:{ color:"#8B9B92", font:{family:"JetBrains Mono", size:11} }, beginAtZero:true }
    }
  };
  if(yMax) base.scales.y.max = yMax;
  return base;
}

function taxaAssistencia(faturado, solicitado){
  const f = num(faturado), s = num(solicitado);
  return f > 0 ? (s / f) * 100 : 0;
}

      ${kpiCard("Acessórios faturados", num(m.acessoriosFaturadas).toLocaleString("pt-BR"), "un.", "var(--rose)", "")}
      ${kpiCard("Acessórios c/ solicitação", num(m.acessoriosSolicitadas).toLocaleString("pt-BR"), "un.", "var(--rose)", "", `Taxa: <b style="color:var(--ink);">${taxaAcess.toFixed(2)}%</b>`)}

/* ============================================================
   VIEW: DIÁRIO DE QUALIDADE (timeline por dia)

function diarioEntriesForMonth(){
  return state.diario
    .filter(e=>e.date && e.date.startsWith(state.selectedMonth))
    .sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
}
function viewDiario(){
  const entries = diarioEntriesForMonth();
  return `
    <div class="kanban-toolbar">
      <span class="hint" style="color:var(--ink-faint); font-size:13px;">${entries.length} registro(s) em ${fmtMonthLabel(state.selectedMonth)}</span>
      <button class="btn primary" id="btn-new-diario">${ICONS.plus}Nova ocorrência</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Ocorrências por Setor</h3><span class="hint">${fmtMonthLabel(state.selectedMonth)}</span></div>
      ${entries.length ? `<div class="chart-wrap short"><canvas id="chart-diario-setor" class="chart-svg"></canvas></div>` : emptyState("Sem ocorrências para gerar o gráfico neste mês","Registre uma ocorrência para começar.")}
    </div>

    <div class="panel">
      ${entries.length ? `<div class="timeline">${entries.map(diarioEntryHtml).join("")}</div>` : emptyState("Nenhuma ocorrência registrada neste mês","Anote aqui o que a equipe encontrar na produção — refugo, retrabalho, desvio de processo, o que for.")}

function diarioSetorAgg(){
  const entries = diarioEntriesForMonth();
  const map = {};
  entries.forEach(e=>{ map[e.setor] = (map[e.setor]||0) + 1; });

}
function wireDiarioChart(){
  const canvas = document.getElementById("chart-diario-setor");
  if(!canvas) return;
  destroyChart("diarioSetor");
  const agg = diarioSetorAgg();
  const labels = agg.map(a=>a[0]);
  const data = agg.map(a=>a[1]);

    type:"bar",
    data:{ labels, datasets:[{ data, backgroundColor:"#C15A2E", borderRadius:6, maxBarThickness:22 }] },

function openDiarioModal(entry){
  const editing = !!entry;
  const defaultDate = state.selectedMonth === todayMonthKey() ? new Date().toISOString().slice(0,10) : state.selectedMonth+"-01";
  const e = entry || { id:uid(), date:defaultDate, setor:SETORES_PRODUCAO[0], gravidade:"Baixa", descricao:"", acao:"" };
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h3>${editing?"Editar registro":"Nova ocorrência de qualidade"}</h3>
        <div class="form-grid" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label>Data</label><input type="date" id="d-date" value="${e.date}"></div>
          <div class="field"><label>Setor</label>
            <select id="d-setor">${SETORES_PRODUCAO.map(s=>`<option value="${s}" ${s===e.setor?"selected":""}>${s}</option>`).join("")}</select>
          </div>
        </div>
        <div class="field"><label>Gravidade</label>
          <div class="tag-select">
            ${Object.keys(GRAVIDADE_META).map(k=>`<span class="status-pill ${k===e.gravidade?'selected':''}" data-gravidade="${k}">${k}</span>`).join("")}
          </div>
        </div>
        <div class="field"><label>O que foi encontrado</label><textarea id="d-desc" placeholder="Ex.: Lote de portas com variação dimensional na furação...">${escapeHtml(e.descricao)}</textarea></div>
        <div class="field"><label>Ação tomada (opcional)</label><textarea id="d-acao" placeholder="Ex.: Peças separadas e retrabalhadas; feedback ao setor de corte.">${escapeHtml(e.acao||"")}</textarea></div>
        <div class="modal-actions">
          <button class="btn ghost" id="m-cancel">Cancelar</button>
          <button class="btn primary" id="m-save">${editing?"Salvar alterações":"Registrar"}</button>
        </div>
      </div>
    </div>
  `;
  let selectedGravidade = e.gravidade;
  root.querySelectorAll(".status-pill").forEach(p=>p.addEventListener("click",()=>{
    selectedGravidade = p.dataset.gravidade;
    root.querySelectorAll(".status-pill").forEach(x=>x.classList.remove("selected"));
    p.classList.add("selected");
  }));
  document.getElementById("m-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-overlay").addEventListener("click", ev=>{ if(ev.target.id==="modal-overlay") closeModal(); });
  document.getElementById("m-save").addEventListener("click", async ()=>{
    const descricao = document.getElementById("d-desc").value.trim();
    const date = document.getElementById("d-date").value;
    if(!date){ alert("Informe a data da ocorrência."); return; }
    if(!descricao){ alert("Descreva o que foi encontrado."); return; }
    const updated = {
      id:e.id, date,
      setor: document.getElementById("d-setor").value,
      gravidade: selectedGravidade,
      descricao,
      acao: document.getElementById("d-acao").value.trim()
    };
    const idx = state.diario.findIndex(x=>x.id===e.id);
    if(idx>=0) state.diario[idx] = updated; else state.diario.push(updated);
    await saveDiario();
    closeModal();
    // se o registro for de um mês diferente do selecionado, acompanha o registro
    state.selectedMonth = date.slice(0,7);
    render();
  });
}

function ncPercent(obj){
  const amostra = num(obj?.amostra), nc = num(obj?.naoConforme);
  return amostra > 0 ? (nc/amostra) * 100 : 0;
}
function qualidadeAtual(){
  const m = state.monthlyData[state.selectedMonth];
  return (m && m.qualidade) ? m.qualidade : { almoxarifado:{amostra:0,naoConforme:0}, estoque:{amostra:0,naoConforme:0}, produtoAcabado:{amostra:0,naoConforme:0} };
}
function viewQualidade(){
  const months = sortedMonths().filter(k=>state.monthlyData[k].qualidade);
  const q = qualidadeAtual();
  const pAlmox = ncPercent(q.almoxarifado), pEstoque = ncPercent(q.estoque), pProdAcab = ncPercent(q.produtoAcabado);
  return `

function wireQualidadeCharts(){
  const months = sortedMonths();
  if(months.length===0) return;
  const labels = months.map(fmtMonthLabel);
  const build = (key)=>{
    const amostra = months.map(k=>num(state.monthlyData[k].qualidade?.[key]?.amostra));
    const nc = months.map(k=>num(state.monthlyData[k].qualidade?.[key]?.naoConforme));
    const pct = amostra.map((a,i)=> a>0 ? (nc[i]/a*100) : 0);
    return { amostra, nc, pct };
  };
  const draw = (canvasId, chartKey, data, metaValue, colorA, colorB, colorLine)=>{
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    destroyChart(chartKey);
    state.charts[chartKey] = new Chart(canvas, {
      data:{ labels, datasets:[
        { type:"bar", label:"Amostra", data:data.amostra, backgroundColor:colorA, borderRadius:5, maxBarThickness:22, yAxisID:"y" },
        { type:"bar", label:"Não conforme", data:data.nc, backgroundColor:colorB, borderRadius:5, maxBarThickness:22, yAxisID:"y" },
        { type:"line", label:"% NC", data:data.pct, borderColor:colorLine, backgroundColor:colorLine, tension:.3, pointRadius:4, yAxisID:"y1" },
        { type:"line", label:"Meta", data:months.map(()=>metaValue), borderColor:colorLine, borderDash:[5,4], pointRadius:0, borderWidth:1.5, yAxisID:"y1" }
      ]},
      options: comboChartOpts()
    });
  };
  draw("chart-nc-almox", "ncAlmox", build("almoxarifado"), state.metas.ncAlmoxarifado, "#EBD9AE", "#D9A441", "#C15A2E");
  draw("chart-nc-estoque", "ncEstoque", build("estoque"), state.metas.ncEstoque, "#CFE0E8", "#5C8AA6", "#2E5C73");
  draw("chart-nc-prodacab", "ncProdAcab", build("produtoAcabado"), state.metas.ncProdutoAcabado, "#E9C6C8", "#BD5F63", "#7C3F44");
}

function openTreinoModal(entry){

  let selectedStatus = t.status;
  root.querySelectorAll(".status-pill").forEach(p=>p.addEventListener("click",()=>{

  }));
  document.getElementById("m-cancel").addEventListener("click", closeModal);

      area: document.getElementById("tr-area").value,
      participantes: num(document.getElementById("tr-participantes").value),
      status: selectedStatus

    const idx = state.treinamentos.findIndex(x=>x.id===t.id);
    if(idx>=0) state.treinamentos[idx] = updated; else state.treinamentos.push(updated);

function viewPlan(){
  const cols = ["afazer","andamento","concluido"];
  return `
    <div class="kanban-toolbar">
      <span class="hint" style="color:var(--ink-faint); font-size:13px;">${state.actions.length} ação(ões) no total</span>
      <button class="btn primary" id="btn-new-action">${ICONS.plus}Nova ação</button>
    </div>
    <div class="kanban">
      ${cols.map(c=>kanbanColumn(c)).join("")}
    </div>
  `;
}
function isOverdue(prazo, status){
  if(!prazo || status==="concluido") return false;
  return new Date(prazo+"T00:00:00") < new Date(new Date().toDateString());
}
function kanbanColumn(statusKey){
  const meta = STATUS_META[statusKey];
  const items = state.actions.filter(a=>a.status===statusKey);
  return `
    <div class="kcol" data-status="${statusKey}">
      <div class="kcol-head">
        <h4><span class="dot" style="background:${meta.dot}"></span>${meta.label}</h4>
        <span class="count">${items.length}</span>
      </div>
      ${items.length ? items.map(cardHtml).join("") : `<div style="text-align:center;color:var(--ink-faint);font-size:12.5px;padding:18px 6px;">Nenhuma ação aqui</div>`}
    </div>
  `;
}
function cardHtml(a){
  const meta = STATUS_META[a.status];
  const overdue = isOverdue(a.prazo, a.status);
  return `
    <div class="kcard" draggable="true" data-id="${a.id}" style="--accent:${meta.color}">
      <div class="ktitle">${escapeHtml(a.title)}</div>
      ${a.desc ? `<div class="kdesc">${escapeHtml(a.desc)}</div>` : ""}
      <div class="kmeta">
        ${a.responsavel ? `<span class="badge">👤 ${escapeHtml(a.responsavel)}</span>` : ""}
        ${a.prazo ? `<span class="badge ${overdue?'overdue':''}">📅 ${a.prazo.split("-").reverse().join("/")}${overdue?" · atrasado":""}</span>` : ""}
      </div>
      <div class="kactions">
        <select class="move" data-id="${a.id}">
          ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${k===a.status?"selected":""}>${v.label}</option>`).join("")}
        </select>
        <div class="kbtns">
          <button class="icon-btn edit-action" data-id="${a.id}" title="Editar">${ICONS.edit}</button>
          <button class="icon-btn del-action" data-id="${a.id}" title="Excluir">${ICONS.trash}</button>
        </div>
      </div>
    </div>
  `;
}
function wirePlan(){
  document.getElementById("btn-new-action")?.addEventListener("click", ()=>openActionModal());
  document.querySelectorAll(".edit-action").forEach(b=>b.addEventListener("click",()=>{
    const a = state.actions.find(x=>x.id===b.dataset.id);
    openActionModal(a);
  }));
  document.querySelectorAll(".del-action").forEach(b=>b.addEventListener("click", async ()=>{
    if(!confirm("Excluir esta ação?")) return;
    state.actions = state.actions.filter(x=>x.id!==b.dataset.id);

    renderView();
  }));
  document.querySelectorAll("select.move").forEach(sel=>sel.addEventListener("change", async ()=>{
    const a = state.actions.find(x=>x.id===sel.dataset.id);
    if(a){ a.status = sel.value; await saveActions(); renderView(); }
  }));

  // drag and drop
  document.querySelectorAll(".kcard").forEach(card=>{
    card.addEventListener("dragstart", ()=>{ card.classList.add("dragging"); });

      if(!dragging) return;
      const a = state.actions.find(x=>x.id===dragging.dataset.id);
      if(a){ a.status = col.dataset.status; await saveActions(); renderView(); }
    });
  });
}

function baseMonthEntry(){
  return {
    score:0, avaliacao:0, ocorrencias:0, skuCount:0, ocorrenciasTotais:0,
    pecasFaturadas:0, pecasSolicitadas:0, acessoriosFaturadas:0, acessoriosSolicitadas:0,
    qualidade: {
      almoxarifado:{ amostra:0, naoConforme:0 },
      estoque:{ amostra:0, naoConforme:0 },
      produtoAcabado:{ amostra:0, naoConforme:0 }
    }
  };
}
function currentMonthDraft(){
  const existing = state.monthlyData[state.selectedMonth];
  const base = baseMonthEntry();
  if(!existing) return base;
  const merged = { ...base, ...JSON.parse(JSON.stringify(existing)) };
  merged.qualidade = {
    almoxarifado:{ ...base.qualidade.almoxarifado, ...(existing.qualidade?.almoxarifado||{}) },
    estoque:{ ...base.qualidade.estoque, ...(existing.qualidade?.estoque||{}) },
    produtoAcabado:{ ...base.qualidade.produtoAcabado, ...(existing.qualidade?.produtoAcabado||{}) }
  };
  return merged;
}
let draft = null;

function resultadoSmartCloudHtml(){
  const months = sortedMonths();
  const m = state.monthlyData[state.selectedMonth];
  return `
    <div class="panel" style="padding:16px 20px; margin-bottom:20px;">
      <div class="panel-head" style="margin-bottom:10px;"><h3 style="font-size:13px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;">SmartCloud — ${fmtMonthLabel(state.selectedMonth)}</h3></div>
      <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr); max-width:480px;">
        ${kpiCard("Número de SKU", num(m?.skuCount).toLocaleString("pt-BR"), "SKUs", "var(--teal)", "")}
        ${kpiCard("Ocorrências totais", num(m?.ocorrenciasTotais).toLocaleString("pt-BR"), "casos", "var(--terracotta)", "")}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Resultado SmartCloud</h3><span class="hint">Score, Ocorrências e Avaliação — eixos separados</span></div>
      ${months.length===0 ? emptyState("Nenhum dado lançado ainda","Preencha o formulário abaixo para começar.") : `
        <div class="three-col">
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">Score (0–5)</div>
            <div class="chart-wrap short"><canvas id="chart-sc-score" class="chart-svg"></canvas></div>
          </div>
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">Ocorrências (%)</div>
            <div class="chart-wrap short"><canvas id="chart-sc-ocorrencias" class="chart-svg"></canvas></div>
          </div>
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">Avaliação (0–5)</div>
            <div class="chart-wrap short"><canvas id="chart-sc-avaliacao" class="chart-svg"></canvas></div>
          </div>
        </div>
      `}
    </div>
  `;
}
function wireResultadoSmartCloud(){
  const months = sortedMonths();
  if(months.length===0) return;
  const labels = months.map(fmtMonthLabel);
  const scores = months.map(k=>state.monthlyData[k].score);
  const ocorr = months.map(k=>state.monthlyData[k].ocorrencias);
  const avals = months.map(k=>state.monthlyData[k].avaliacao);

  const mini = (canvasId, chartKey, values, type, faixaInverted, metaValue)=>{
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    destroyChart(chartKey);
    const colors = values.map(v=>faixaFor(v, faixaInverted).color);
    state.charts[chartKey] = new Chart(canvas, {
      data:{ labels, datasets:[
        type==="bar"
          ? { type:"bar", data:values, backgroundColor:colors, borderRadius:5, maxBarThickness:26 }
          : { type:"line", data:values, borderColor:"#1F6F63", backgroundColor:"rgba(31,111,99,.10)", tension:.35, fill:true, pointRadius:4, pointBackgroundColor:colors, pointBorderColor:"#fff", pointBorderWidth:1.5 },
        { type:"line", data:months.map(()=>metaValue), borderColor:"#8B9B92", borderDash:[5,4], pointRadius:0, borderWidth:1.5 }
      ]},
      options:{ ...chartOpts(type==="bar"?{}:{yMax:5}), plugins:{...chartOpts({}).plugins, legend:{display:false}} }
    });
  };
  mini("chart-sc-score", "scScore", scores, "line", false, state.metas.score);
  mini("chart-sc-ocorrencias", "scOcorrencias", ocorr, "bar", true, state.metas.ocorrencias);
  mini("chart-sc-avaliacao", "scAvaliacao", avals, "line", false, state.metas.avaliacao);
}

function viewData(){
  return `
    ${resultadoSmartCloudHtml()}
    <div class="panel" style="padding:14px 18px; margin-bottom:20px;">
      <div class="tag-select">
        <span class="status-pill ${state.dataMode==='mensal'?'selected':''}" data-mode="mensal">Mês a mês</span>
        <span class="status-pill ${state.dataMode==='lote'?'selected':''}" data-mode="lote">Histórico em lote</span>
      </div>
    </div>
    ${state.dataMode==='lote' ? viewDataBulk() : viewDataMensal()}
  `;
}

function viewDataMensal(){
  draft = currentMonthDraft();
  return `
    <div class="panel">
      <fieldset>
        <legend>Indicadores Madeira Madeira — ${fmtMonthLabel(state.selectedMonth)}</legend>
        <div class="form-grid">
          <div class="field">
            <label>Score (0–5)</label>
            <input type="number" step="0.01" min="0" max="5" id="f-score" value="${draft.score}">
            <div id="badge-score" style="margin-top:6px;">${faixaBadge(draft.score)}</div>
          </div>
          <div class="field">
            <label>Avaliação (0–5)</label>
            <input type="number" step="0.01" min="0" max="5" id="f-avaliacao" value="${draft.avaliacao}">
            <div id="badge-avaliacao" style="margin-top:6px;">${faixaBadge(draft.avaliacao)}</div>
          </div>
          <div class="field">
            <label>Ocorrências (%)</label>
            <input type="number" step="0.01" min="0" id="f-ocorrencias" value="${draft.ocorrencias}">
            <div id="badge-ocorrencias" style="margin-top:6px;">${faixaBadge(draft.ocorrencias, true)}</div>
          </div>
          <div class="field"><label>Número de SKU</label><input type="number" step="1" min="0" id="f-sku" value="${draft.skuCount}"></div>
          <div class="field"><label>Ocorrências totais (qtd.)</label><input type="number" step="1" min="0" id="f-ocorrencias-totais" value="${draft.ocorrenciasTotais}"></div>
        </div>
        <p class="hint" style="margin:10px 0 0;">Score e Avaliação: 0 a 5, quanto maior melhor. Ocorrências: % de pedidos com ocorrência, quanto menor melhor — as faixas de cor seguem a mesma tabela, mas invertida.</p>
      </fieldset>

      <div class="save-bar">
        <button class="btn primary" id="save-month">Salvar dados de ${fmtMonthLabel(state.selectedMonth)}</button>
        <span class="save-msg" id="save-msg">Salvo com sucesso.</span>
      </div>
    </div>

    <div class="panel">
      <fieldset style="margin-bottom:0;">
        <legend>Metas</legend>
        <div class="form-grid">
          <div class="field"><label>Meta de Score (0–5)</label><input type="number" step="0.01" min="0" max="5" id="meta-score" value="${state.metas.score}"></div>
          <div class="field"><label>Meta de Avaliação (0–5)</label><input type="number" step="0.01" min="0" max="5" id="meta-avaliacao" value="${state.metas.avaliacao}"></div>
          <div class="field"><label>Teto de Ocorrências (%)</label><input type="number" step="0.01" min="0" id="meta-ocorrencias" value="${state.metas.ocorrencias}"></div>
        </div>
        <div class="save-bar">
          <button class="btn ghost" id="save-metas">Salvar metas</button>
          <span class="save-msg" id="meta-msg">Metas atualizadas.</span>
        </div>
      </fieldset>
    </div>
  `;
}

/* ---- Lançamento em lote (histórico do ano) ---- */
function availableYears(){
  const years = new Set([state.bulkYear]);
  sortedMonths().forEach(k=>years.add(k.slice(0,4)));
  years.add(todayMonthKey().slice(0,4));
  return Array.from(years).sort();
}
function viewDataBulk(){
  const year = state.bulkYear;
  const rows = MONTH_NAMES.map((name, idx)=>{
    const key = year + "-" + String(idx+1).padStart(2,"0");
    const d = state.monthlyData[key];
    return {
      key, name,
      score:d?d.score:"", avaliacao:d?d.avaliacao:"", ocorrencias:d?d.ocorrencias:"",
      hasData:!!d
    };
  });
  const th = (label)=>`<th style="padding:8px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); border-bottom:1px solid var(--border); white-space:nowrap;">${label}</th>`;
  const numInput = (cls, val, max)=>`<input type="number" step="${max?'0.01':'1'}" min="0" ${max?`max="${max}"`:""} class="${cls}" value="${val}" placeholder="—" style="width:82px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-family:'JetBrains Mono',monospace;">`;
  return `
    <div class="panel">
      <div class="panel-head">
        <h3>Histórico ${year} — lançamento rápido</h3>
        <select id="bulk-year" style="border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal-dark);font-weight:600;background:#FBFCFB;">
          ${availableYears().map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}
        </select>
      </div>
      <p class="hint" style="margin:-6px 0 16px;">Preencha Score, Avaliação e Ocorrências de cada mês e salve tudo de uma vez. O índice de peças/acessórios agora é lançado na aba <b>Análise Gestão Pós Venda</b>.</p>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; min-width:560px;">
          <thead>
            <tr style="text-align:left;">
              ${th("Mês")}${th("Score (0–5)")}${th("Avaliação (0–5)")}${th("Ocorrências (%)")}
            </tr>
          </thead>
          <tbody>
            ${rows.map(r=>`
              <tr data-key="${r.key}" style="${r.hasData?'':'opacity:.6;'}">
                <td style="padding:7px 10px; border-bottom:1px solid var(--border); font-weight:600; font-size:13px; white-space:nowrap;">${r.name}/${year.slice(2)}</td>
                <td style="padding:7px 10px; border-bottom:1px solid var(--border);">${numInput("bulk-score", r.score, 5)}</td>
                <td style="padding:7px 10px; border-bottom:1px solid var(--border);">${numInput("bulk-avaliacao", r.avaliacao, 5)}</td>
                <td style="padding:7px 10px; border-bottom:1px solid var(--border);">${numInput("bulk-ocorrencias", r.ocorrencias)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <div class="save-bar">
        <button class="btn primary" id="save-bulk">Salvar histórico de ${year}</button>
        <span class="save-msg" id="bulk-msg">Histórico salvo com sucesso.</span>
      </div>
    </div>
  `;
}

function wireData(){
  wireResultadoSmartCloud();
  document.querySelectorAll('[data-mode]').forEach(p=>p.addEventListener("click", ()=>{
    state.dataMode = p.dataset.mode;
    renderView();
  }));
  if(state.dataMode==='lote') wireDataBulk();
  else wireDataMensal();
}
function wireDataMensal(){
  document.getElementById("f-score").addEventListener("input", e=>{
    document.getElementById("badge-score").innerHTML = faixaBadge(num(e.target.value));
  });
  document.getElementById("f-avaliacao").addEventListener("input", e=>{
    document.getElementById("badge-avaliacao").innerHTML = faixaBadge(num(e.target.value));
  });
  document.getElementById("f-ocorrencias").addEventListener("input", e=>{
    document.getElementById("badge-ocorrencias").innerHTML = faixaBadge(num(e.target.value), true);
  });
  document.getElementById("save-month").addEventListener("click", async ()=>{
    draft.score = num(document.getElementById("f-score").value);
    draft.avaliacao = num(document.getElementById("f-avaliacao").value);
    draft.ocorrencias = num(document.getElementById("f-ocorrencias").value);
    draft.skuCount = num(document.getElementById("f-sku").value);
    draft.ocorrenciasTotais = num(document.getElementById("f-ocorrencias-totais").value);
    state.monthlyData[state.selectedMonth] = draft;
    await saveMonthlyData();
    const msg = document.getElementById("save-msg");
    msg.classList.add("show");
    setTimeout(()=>msg.classList.remove("show"), 2200);
  });
  document.getElementById("save-metas").addEventListener("click", async ()=>{
    state.metas.score = num(document.getElementById("meta-score").value);
    state.metas.avaliacao = num(document.getElementById("meta-avaliacao").value);
    state.metas.ocorrencias = num(document.getElementById("meta-ocorrencias").value);
    await saveMetas();
    const msg = document.getElementById("meta-msg");
    msg.classList.add("show");
    setTimeout(()=>msg.classList.remove("show"), 2200);
  });
}
function wireDataBulk(){
  document.getElementById("bulk-year").addEventListener("change", e=>{
    state.bulkYear = e.target.value;
    renderView();
  });
  document.getElementById("save-bulk").addEventListener("click", async ()=>{
    document.querySelectorAll("#view-root tbody tr[data-key]").forEach(row=>{
      const key = row.dataset.key;
      const score = row.querySelector(".bulk-score").value;
      const avaliacao = row.querySelector(".bulk-avaliacao").value;
      const ocorrencias = row.querySelector(".bulk-ocorrencias").value;
      const allEmpty = [score,avaliacao,ocorrencias].every(v=>v==="");
      if(allEmpty) return; // não cria mês vazio
      const existing = state.monthlyData[key] || baseMonthEntry();
      state.monthlyData[key] = {
        ...existing,
        score: num(score, existing.score||0),
        avaliacao: num(avaliacao, existing.avaliacao||0),
        ocorrencias: num(ocorrencias, existing.ocorrencias||0)
      };
    });
    await saveMonthlyData();
    const msg = document.getElementById("bulk-msg");
    msg.classList.add("show");
    setTimeout(()=>msg.classList.remove("show"), 2600);
    renderView();
  });
}

  document.getElementById("app").innerHTML = `<div style="padding:60px;font-family:'Inter',sans-serif;color:#5C6E65;">Carregando painel...</div>`;
  await Promise.all([loadAll(), window.CHART_READY]);
  render();
})();
</script>
